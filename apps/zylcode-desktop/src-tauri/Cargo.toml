[package]
name = "zylcode-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ZylCode Tauri 2.0 desktop host — cross-platform (macOS, Windows, Linux)"
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zylcode-core = { workspace = true }
zylcode-mcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
rusqlite = { version = "0.41", features = ["bundled"] }

[features]
# Production / standalone builds.
#
# Measured 2026-10-26 on Tauri 2.12: `tauri build` does NOT set this cargo
# feature — `CARGO_FEATURE_CUSTOM_PROTOCOL` is absent in the build script — yet
# it still produces a working bundle with the frontend embedded. A bare
# `cargo build --release` leaves the feature off too, and that build DOES load
# `devUrl` (the Vite dev server), so the exe shows "localhost refused to
# connect" unless `pnpm dev` is running. Use `tauri build`, or pass the feature
# explicitly. See GitHub issue #1.
custom-protocol = ["tauri/custom-protocol"]
