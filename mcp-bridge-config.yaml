    secrets:
      - id: "vault.read_secret"
        name: "Vault Read Secret"
        description: "Read secret from HashiCorp Vault"
        enabled: true
        
      - id: "aws.secrets.get"
        name: "AWS Secrets Get"
        description: "Get secret from AWS Secrets Manager"
        enabled: true
    
    authentication:
      - id: "auth0.verify"
        name: "Auth0 Verify"
        description: "Verify token with Auth0"
        enabled: true

# External tool configuration
external_tools:
  # Example external tool configuration
  - id: "custom_tool"
    command: "node"
    args: ["path/to/tool.js"]
    transport: "stdio"
    env:
      NODE_ENV: "production"
    enabled: false
    description: "Custom external tool"

# Security settings
security:
  # Permission levels
  permissions:
    - level: "read"
      description: "Read-only access"
    - level: "write"
      description: "Read-write access"
    - level: "execute"
      description: "Execute commands"
    - level: "admin"
      description: "Administrative access"
  
  # Sandboxing
  sandbox:
    enabled: true
    timeout_ms: 30000
    memory_limit_mb: 512
    network_access: false
    filesystem_access: "restricted"

# Telemetry settings
telemetry:
  enabled: true
  metrics:
    - name: "tool_execution_time"
      type: "histogram"
      description: "Tool execution duration"
    - name: "tool_success_rate"
      type: "counter"
      description: "Tool execution success rate"
    - name: "tool_error_rate"
      type: "counter"
      description: "Tool execution error rate"
  
  logging:
    level: "info"
    format: "json"
    output: "stdout"

# Audit settings
audit:
  enabled: true
  events:
    - "tool_call"
    - "tool_denied"
    - "tool_error"
    - "permission_check"
    - "security_event"
  
  retention_days: 30
  storage: "sqlite"