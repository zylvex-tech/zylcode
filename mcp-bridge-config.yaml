  # Cloud Services (15+)
  cloud:
    aws:
      - id: "aws.s3.upload"
        name: "AWS S3 Upload"
        description: "Upload file to AWS S3"
        enabled: true
        
      - id: "aws.lambda.invoke"
        name: "AWS Lambda Invoke"
