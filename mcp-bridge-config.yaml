        enabled: true

  # Database Tools (10+)
  database:
    sql:
      - id: "postgres.query"
        name: "PostgreSQL Query"
        description: "Execute SQL query on PostgreSQL"
        enabled: true
        
      - id: "mysql.query"
        name: "MySQL Query"
        description: "Execute SQL query on MySQL"
        enabled: true
        
      - id: "sqlite.query"
        name: "SQLite Query"
        description: "Execute SQL query on SQLite"
        enabled: true
        
      - id: "mssql.query"
        name: "SQL Server Query"
        description: "Execute SQL query on SQL Server"
        enabled: true
    
    nosql:
      - id: "mongodb.find"
        name: "MongoDB Find"
        description: "Find documents in MongoDB"
        enabled: true
        
      - id: "redis.get"
        name: "Redis Get"
        description: "Get value from Redis"
        enabled: true
        
      - id: "dynamodb.query"
        name: "DynamoDB Query"
        description: "Query items in DynamoDB"
        enabled: true
    
    orms:
      - id: "prisma.query"
        name: "Prisma Query"
        description: "Execute Prisma query"
        enabled: true
        
      - id: "typeorm.query"
