        enabled: true
    
    vector_databases:
      - id: "pinecone.query"
        name: "Pinecone Query"
        description: "Query vectors in Pinecone"
        enabled: true
        
      - id: "weaviate.query"
        name: "Weaviate Query"
        description: "Query vectors in Weaviate"
        enabled: true
        
      - id: "chroma.query"
        name: "Chroma Query"
        description: "Query vectors in Chroma"
        enabled: true
        
      - id: "milvus.query"
        name: "Milvus Query"
        description: "Query vectors in Milvus"
        enabled: true
    
    ml_frameworks:
      - id: "tensorflow.train"
        name: "TensorFlow Train"
        description: "Train model with TensorFlow"
        enabled: true
        
      - id: "pytorch.train"
        name: "PyTorch Train"
        description: "Train model with PyTorch"
        enabled: true
        
      - id: "sklearn.train"
