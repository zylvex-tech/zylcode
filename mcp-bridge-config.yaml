# Enhanced MCP Bridge Configuration
# 100+ tools across 8 categories

bridge:
  name: "ZylCode Enhanced MCP Bridge"
  version: "2.0.0"
  description: "Comprehensive MCP bridge with 100+ built-in tools"
  
  # Global settings
  settings:
    timeout_ms: 30000
    max_concurrent_calls: 10
    retry_attempts: 3
    enable_telemetry: true
    enable_audit_logging: true

# Tool categories
categories:
  development:
    name: "Development Tools"
    description: "Code management, building, and testing tools"
    enabled: true
    
  ai-ml:
    name: "AI/ML Tools"
    description: "Artificial Intelligence and Machine Learning tools"
    enabled: true
    
  database:
    name: "Database Tools"
    description: "Database management and query tools"
    enabled: true
    
  cloud:
    name: "Cloud Services"
    description: "Cloud service management tools"
    enabled: true
    
  devops:
    name: "DevOps Tools"
    description: "DevOps and infrastructure tools"
    enabled: true
    
  communication:
    name: "Communication Tools"
    description: "Communication and notification tools"
    enabled: true
    
  productivity:
    name: "Productivity Tools"
    description: "Productivity and project management tools"
    enabled: true
    
  security:
    name: "Security Tools"
    description: "Security scanning and management tools"
    enabled: true

# Built-in tools configuration
builtin_tools:
  # Development Tools (25+)
  development:
    git:
      - id: "git.commit"
        name: "Git Commit"
        description: "Create a git commit with message and files"
        enabled: true
        
      - id: "git.push"
        name: "Git Push"
        description: "Push commits to remote repository"
        enabled: true
        
      - id: "git.pull"
        name: "Git Pull"
        description: "Pull changes from remote repository"
        enabled: true
        
      - id: "git.branch"
        name: "Git Branch"
        description: "Create, list, or delete branches"
        enabled: true
        
      - id: "git.merge"
        name: "Git Merge"
        description: "Merge branches"
        enabled: true
        
      - id: "git.rebase"
        name: "Git Rebase"
        description: "Rebase current branch"
        enabled: true
        
      - id: "git.stash"
        name: "Git Stash"
        description: "Stash current changes"
        enabled: true
        
      - id: "git.tag"
        name: "Git Tag"
        description: "Create or list tags"
        enabled: true
    
    package_managers:
      - id: "npm.install"
        name: "NPM Install"
        description: "Install npm packages"
        enabled: true
        
      - id: "yarn.install"
        name: "Yarn Install"
        description: "Install yarn packages"
        enabled: true
        
      - id: "pnpm.install"
        name: "PNPM Install"
        description: "Install pnpm packages"
        enabled: true
        
      - id: "pip.install"
        name: "PIP Install"
        description: "Install Python packages"
        enabled: true
        
      - id: "cargo.build"
        name: "Cargo Build"
        description: "Build Rust project"
        enabled: true
        
      - id: "go.mod"
        name: "Go Mod"
        description: "Go module operations"
        enabled: true
    
    build_systems:
      - id: "webpack.build"
        name: "Webpack Build"
        description: "Build project with webpack"
        enabled: true
        
      - id: "vite.build"
        name: "Vite Build"
        description: "Build project with Vite"
        enabled: true
        
      - id: "rollup.build"
        name: "Rollup Build"
        description: "Build project with Rollup"
        enabled: true
        
      - id: "esbuild.build"
        name: "ESBuild Build"
        description: "Build project with ESBuild"
        enabled: true
    
    testing:
      - id: "jest.test"
        name: "Jest Test"
        description: "Run tests with Jest"
        enabled: true
        
      - id: "vitest.test"
        name: "Vitest Test"
        description: "Run tests with Vitest"
        enabled: true
        
      - id: "playwright.test"
        name: "Playwright Test"
        description: "Run E2E tests with Playwright"
        enabled: true
        
      - id: "cypress.test"
        name: "Cypress Test"
        description: "Run E2E tests with Cypress"
        enabled: true
    
    linting:
      - id: "eslint.lint"
        name: "ESLint"
        description: "Lint code with ESLint"
        enabled: true
        
      - id: "prettier.format"
        name: "Prettier"
        description: "Format code with Prettier"
        enabled: true
        
      - id: "black.format"
        name: "Black"
        description: "Format Python code with Black"
        enabled: true
        
      - id: "rustfmt.format"
        name: "Rustfmt"
        description: "Format Rust code with Rustfmt"
        enabled: true

  # AI/ML Tools (15+)
  ai-ml:
    models:
      - id: "openai.complete"
        name: "OpenAI Complete"
        description: "Generate text completion with OpenAI"
        enabled: true
        
      - id: "anthropic.complete"
