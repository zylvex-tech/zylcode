    vercel:
      - id: "vercel.deploy"
        name: "Vercel Deploy"
        description: "Deploy project to Vercel"
        enabled: true
        
      - id: "vercel.env.list"
        name: "Vercel Env List"
        description: "List Vercel environment variables"
        enabled: true
    
    netlify:
      - id: "netlify.deploy"
        name: "Netlify Deploy"
        description: "Deploy project to Netlify"
        enabled: true

  # DevOps Tools (10+)
  devops:
    containers:
      - id: "docker.build"
        name: "Docker Build"
        description: "Build Docker image"
        enabled: true
        
      - id: "docker.run"
        name: "Docker Run"
