[package]
name = "zylcode-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ZylCode MCP bridge — dynamic tool registration, structured logging, error recovery"
rust-version.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
notify = { workspace = true }
sha2 = { workspace = true }
uuid = { version = "1", features = ["v4"] }
opentelemetry = { version = "0.28", features = ["trace"] }
opentelemetry_sdk = { version = "0.28", features = ["trace"] }
opentelemetry-otlp = { version = "0.28", features = ["tonic"] }
opentelemetry-stdout = { version = "0.28" }
tracing-opentelemetry = "0.28"
http = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
fastrand = "2"
tempfile = "3"

[[bench]]
name = "concurrency"
harness = false