[workspace]
members = [
    "crates/zylcode-core",
    "crates/zylcode-mcp",
    "crates/zylcode-cli",
    "apps/zylcode-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
authors = ["ZylCode Team <team@zylcode.dev>"]
license = "MIT"
repository = "https://github.com/zylcode/zylcode"
description = "ZylCode — autonomous, cross-platform developer desktop engine, CLI, and real-time artifact visualizer"
rust-version = "1.77"

[workspace.dependencies]
zylcode-core = { path = "crates/zylcode-core" }
zylcode-mcp = { path = "crates/zylcode-mcp" }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# SQL (Phase 6.3)
rusqlite = { version = "0.31", features = ["bundled"], default-features = false }

# HTTP client (token router)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"
regex = "1.10"

# Perf (Phase 1)
ahash = "0.8"
lru = "0.12"
memchr = "2.7"

# MCP (Phase 2)
serde_yaml = "0.9"
notify = "6.1"

# Crypto / Hashing (Phase 4.3)
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
