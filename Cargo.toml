[workspace]
members = [
    "crates/zylcode-core",
    "crates/zylcode-mcp",
    "crates/zylcode-nav",
    "crates/zylcode-cli",
    "apps/zylcode-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
authors = ["ZylCode Team <team@zylcode.dev>"]
license = "MIT"
repository = "https://github.com/zylvex-tech/zylcode"
description = "ZylCode — autonomous, cross-platform developer desktop engine, CLI, and real-time artifact visualizer"
rust-version = "1.77"

[workspace.dependencies]
# Version is required alongside path so `cargo publish` can rewrite
# internal deps to their crates.io versions (publishing fails without it).
zylcode-core = { path = "crates/zylcode-core", version = "0.2.0" }
zylcode-mcp = { path = "crates/zylcode-mcp", version = "0.2.0" }
# Leaf crate: deterministic repository navigation (AST, symbols, references,
# graphs). Sits *below* both zylcode-core and zylcode-mcp so neither has to
# depend on the other (core -> mcp is the only edge between them).
zylcode-nav = { path = "crates/zylcode-nav", version = "0.2.0" }

# Repository Navigation (AST parsing for symbols/references/imports)
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Async traits
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# SQL (Phase 6.3)
rusqlite = { version = "0.31", features = ["bundled"], default-features = false }

# HTTP client (token router)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"
regex = "1.10"

# Perf (Phase 1)
ahash = "0.8"
lru = "0.18"
memchr = "2.7"

# MCP (Phase 2)
serde_norway = "0.9.42"
notify = "6.1"

# Crypto / Hashing (Phase 4.3)
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

# Repository Intelligence (Phase 2A)
toml = "0.8"
glob = "0.3"
