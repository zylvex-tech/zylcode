[workspace]
members = [
    "crates/zylcode-core",
    "crates/zylcode-cli",
    "apps/zylcode-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["ZylCode Team <team@zylcode.dev>"]
license = "MIT"
repository = "https://github.com/zylcode/zylcode"
description = "ZylCode — autonomous, cross-platform developer desktop engine, CLI, and real-time artifact visualizer"
rust-version = "1.77"

[workspace.dependencies]
zylcode-core = { path = "crates/zylcode-core" }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# HTTP client (token router)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"
regex = "1.10"
