name: Release
# Tag-driven only. With a `branches:` filter present, `github.ref_name`
# resolves to the branch, so every push to main tried to cut a release tagged
# `main` (and `tagName: ${{ github.ref_name }}` below would have published it).
# A release is only ever cut from an explicit `v*` tag.
on:
  push:
    tags:
      - "v*"

# `contents: write` is what lets the token create a release. There is no
# `releases` permission — GitHub rejects a workflow that names an unknown
# one, which is why every run of this file finished `failure` with zero jobs
# before any step could start.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      # Every artifact is built for an EXPLICIT target. The previous matrix was
      # `platform: [ubuntu-22.04, windows-latest, macos-latest]` with no target,
      # so tauri-action built only the runner's *native* architecture. That is
      # why v0.2.1 shipped Linux x86_64 only and macOS arm64 only: `macos-latest`
      # is Apple silicon and `ubuntu-22.04` is x86_64.
      #
      # The `target` is passed to tauri-action with `--target`, so each leg
      # produces a deterministically named artifact regardless of the runner it
      # happens to run on.
      #
      # Legs:
      #   * ubuntu-22.04            -> x86_64 Linux   (native)
      #   * ubuntu-22.04-arm        -> aarch64 Linux   (native ARM runner; the
      #                                `cross` container has no webkit2gtk/GTK
      #                                system libs, so we build on real arm64.
      #                                22.04 (not 24.04) keeps glibc compatible
      #                                with the x86_64 AppImage and avoids the
      #                                webkit2gtk sysroot issues seen on 24.04.)
      #   * windows-latest          -> x86_64 Windows  (native)
      #   * macos-latest (arm64)    -> aarch64 macOS   (native Apple silicon)
      #   * macos-latest (arm64)    -> x86_64 macOS    (cross-target; `macos-13`
      #                                Intel is retired in 2026 and Intel runners
      #                                are large/paid only, so we cross-compile
      #                                from Apple silicon — the macOS SDK is
      #                                universal and links x86_64 fine)
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust-target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils is not incidental: the AppImage step fails outright
          # with `xdg-open binary not found /usr/bin/xdg-open` when it is
          # missing — that is exactly how the v0.2.2 aarch64 leg failed
          # (run 40466938422), five minutes after a green compile.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app assets
        run: pnpm --filter zylcode-desktop build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/zylcode-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ZylCode ${{ github.ref_name }}"
          args: --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # Checksum manifest.
  #
  # The five build legs upload their bundles straight to the release, so until
  # this job existed a release published twelve binaries with nothing to verify
  # them against. v0.2.3 shipped exactly that way.
  #
  # It runs only when every leg succeeded (`needs: release`, default
  # success-only condition), then re-downloads the *published* assets — not the
  # local build output — so the checksums describe what a user will actually
  # download. If the expected set is incomplete it fails without publishing a
  # manifest: a partial SHA256SUMS is worse than none, because it looks like the
  # assets were verified.
  #
  # Operational rule: this job hashes whatever is attached when it runs, and
  # nothing re-triggers it. If a build leg is re-run after it ("Re-run failed
  # jobs" on the release workflow), re-run this job too, or the published
  # manifest will describe the previous upload.
  # ---------------------------------------------------------------------------
  checksums:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the published assets
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --clobber
          # A manifest from a previous attempt must never be hashed into its
          # successor, which would make the file describe itself.
          rm -f dist/SHA256SUMS

      - name: Verify the expected artifact set
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The 12 assets v0.2.3 actually published, generalised over version.
          expected=(
            "ZylCode_${version}_amd64.AppImage"
            "ZylCode_${version}_aarch64.AppImage"
            "ZylCode_${version}_amd64.deb"
            "ZylCode_${version}_arm64.deb"
            "ZylCode-${version}-1.x86_64.rpm"
            "ZylCode-${version}-1.aarch64.rpm"
            "ZylCode_${version}_x64-setup.exe"
            "ZylCode_${version}_x64_en-US.msi"
            "ZylCode_${version}_x64.dmg"
            "ZylCode_${version}_aarch64.dmg"
            "ZylCode_x64.app.tar.gz"
            "ZylCode_aarch64.app.tar.gz"
          )
          missing=()
          for name in "${expected[@]}"; do
            [[ -f "dist/$name" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            for name in "${missing[@]}"; do
              echo "::error::expected release asset is missing: $name"
            done
            echo "Refusing to publish a SHA256SUMS that would cover an incomplete release."
            exit 1
          fi
          echo "All ${#expected[@]} expected assets are present."

      - name: Generate and verify SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          # Verify the manifest against the files before it is published: a
          # checksum file nobody checked is a claim, not evidence.
          sha256sum --check --strict SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Publish SHA256SUMS and verify the uploaded copy
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/SHA256SUMS --clobber
          # Confirm the asset served by the release is byte-identical to the
          # manifest that was verified locally.
          mkdir -p verify
          gh release download "$TAG" --pattern SHA256SUMS --dir verify --clobber
          cmp dist/SHA256SUMS verify/SHA256SUMS
          echo "Published manifest matches the verified local copy."
