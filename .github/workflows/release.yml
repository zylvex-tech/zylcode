name: Release
# Tag-driven only. With a `branches:` filter present, `github.ref_name`
# resolves to the branch, so every push to main tried to cut a release tagged
# `main` (and `tagName: ${{ github.ref_name }}` below would have published it).
# A release is only ever cut from an explicit `v*` tag.
on:
  push:
    tags:
      - 'v*'

# `contents: write` is what lets the token create a release. There is no
# `releases` permission — GitHub rejects a workflow that names an unknown
# one, which is why every run of this file finished `failure` with zero jobs
# before any step could start.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app assets
        run: pnpm --filter zylcode-desktop build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/zylcode-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ZylCode ${{ github.ref_name }}"
